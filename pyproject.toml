# Tooling configuration only: this repository ships skills and scripts, not a Python package.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"local_coder_mcp_server.py" = ["E402"]
"ask_coder.py" = ["E402"]
".agents/skills/*/scripts/*" = ["E402"]
